name: Validate Gemini Markets CLI

on:
  pull_request:
    paths:
      - "packages/gemini-markets-cli/**"
      - "packages/sdk-go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/validate-gemini-markets-cli.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The root workspace includes the SDK generator module, whose pinned Go
      # version defines the monorepo toolchain used by this integration check.
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: packages/gemini-markets-cli

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: packages/sdk-go/scripts/go.mod
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            packages/gemini-markets-cli/go.mod
            packages/gemini-markets-cli/go.sum
            packages/sdk-go/go.mod
            packages/sdk-go/go.sum
            packages/sdk-go/cmd/demo/go.mod
            packages/sdk-go/cmd/demo/go.sum
            packages/sdk-go/scripts/go.mod
            packages/sdk-go/scripts/go.sum
            packages/sdk-go/websocket/gorilla/go.mod
            packages/sdk-go/websocket/gorilla/go.sum
            samples/go/go.mod
            samples/go/go.sum

      - name: Verify module dependencies
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files require gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build command
        run: go build -o "${{ runner.temp }}/gemini-markets" ./cmd/gemini-markets
      - name: Smoke-test help
        run: go run ./cmd/gemini-markets --help
      - name: Check package documentation
        run: go doc ./internal/cli
