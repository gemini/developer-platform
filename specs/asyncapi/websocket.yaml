components:
  securitySchemes:
    geminiApiKeySignature:
      type: httpApiKey
      name: X-GEMINI-APIKEY
      in: header
      description: |
        Account-scoped Gemini API key supplied during the WebSocket upgrade.
        This scheme represents the full Gemini HMAC-signed header set. A valid
        handshake also includes `X-GEMINI-NONCE`, `X-GEMINI-PAYLOAD`, and
        `X-GEMINI-SIGNATURE`; `X-GEMINI-PAYLOAD` is `base64(string(nonce))`,
        and `X-GEMINI-SIGNATURE` is `hex(hmac_sha384(payload, api_secret))`.
        Only account-scoped keys with time-based nonces are accepted; master or
        group keys are rejected with HTTP 401.
      x-gemini-required-headers:
        - X-GEMINI-APIKEY
        - X-GEMINI-NONCE
        - X-GEMINI-PAYLOAD
        - X-GEMINI-SIGNATURE
      x-gemini-key-scope: account
      x-gemini-nonce: time-based
      x-gemini-signature-algorithm: HMAC-SHA384
    geminiOAuthBearer:
      type: http
      scheme: bearer
      bearerFormat: Gemini OAuth 2.0 access token
      description: |
        OAuth 2.0 access token supplied as `Authorization: Bearer <access_token>`
        during the WebSocket upgrade. The token must include scopes/capabilities
        for the private streams or methods used on the connection.
  parameters:
    symbol:
      description: |
        Exchange symbol. For trading markets this may be a symbol like `btcusd`.
        For prediction markets this is an instrument symbol such as
        `GEMI-BTC05M2606011000-UP`.
  messages:
    ConninfoRequest:
      name: ConninfoRequest
      title: conninfo request
      payload:
        $ref: '#/components/schemas/ConninfoRequest'
    PingRequest:
      name: PingRequest
      title: ping request
      payload:
        $ref: '#/components/schemas/PingRequest'
    TimeRequest:
      name: TimeRequest
      title: time request
      payload:
        $ref: '#/components/schemas/TimeRequest'
    SubscribeRequest:
      name: SubscribeRequest
      title: subscribe request
      payload:
        $ref: '#/components/schemas/SubscribeRequest'
    UnsubscribeRequest:
      name: UnsubscribeRequest
      title: unsubscribe request
      payload:
        $ref: '#/components/schemas/UnsubscribeRequest'
    ListSubscriptionsRequest:
      name: ListSubscriptionsRequest
      title: list subscriptions request
      payload:
        $ref: '#/components/schemas/ListSubscriptionsRequest'
    DepthRequest:
      name: DepthRequest
      title: depth request
      payload:
        $ref: '#/components/schemas/DepthRequest'
    OrderPlaceRequest:
      name: OrderPlaceRequest
      title: order.place request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        roles: [Trader]
      payload:
        $ref: '#/components/schemas/OrderPlaceRequest'
    OrderCancelRequest:
      name: OrderCancelRequest
      title: order.cancel request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        roles: [Trader]
      payload:
        $ref: '#/components/schemas/OrderCancelRequest'
    OrderCancelAllRequest:
      name: OrderCancelAllRequest
      title: order.cancel_all request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        roles: [Trader]
      payload:
        $ref: '#/components/schemas/OrderCancelAllRequest'
    OrderCancelSessionRequest:
      name: OrderCancelSessionRequest
      title: order.cancel_session request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        roles: [Trader]
      payload:
        $ref: '#/components/schemas/OrderCancelSessionRequest'
    RfqSubmitQuoteRequest:
      name: RfqSubmitQuoteRequest
      title: rfq.submit_quote request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        capabilities: [place_orders]
      payload:
        $ref: '#/components/schemas/RfqSubmitQuoteRequest'
    RfqWithdrawQuoteRequest:
      name: RfqWithdrawQuoteRequest
      title: rfq.withdraw_quote request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        capabilities: [cancel_orders]
      payload:
        $ref: '#/components/schemas/RfqWithdrawQuoteRequest'
    RfqConfirmQuoteRequest:
      name: RfqConfirmQuoteRequest
      title: rfq.confirm_quote request
      x-gemini-auth:
        required: true
        timing: websocket-upgrade
        alternatives: [geminiApiKeySignature, geminiOAuthBearer]
        capabilities: [place_orders]
      payload:
        $ref: '#/components/schemas/RfqConfirmQuoteRequest'
    GenericSuccessResponse:
      name: GenericSuccessResponse
      title: generic success response
      payload:
        $ref: '#/components/schemas/GenericSuccessResponse'
    ListSubscriptionsResponse:
      name: ListSubscriptionsResponse
      title: list subscriptions response
      payload:
        $ref: '#/components/schemas/ListSubscriptionsResponse'
    DepthResponse:
      name: DepthResponse
      title: depth response
      payload:
        $ref: '#/components/schemas/DepthResponse'
    OrderActionResponse:
      name: OrderActionResponse
      title: order action response
      payload:
        $ref: '#/components/schemas/OrderActionResponse'
    RfqSubmitQuoteResponse:
      name: RfqSubmitQuoteResponse
      title: rfq.submit_quote response
      payload:
        $ref: '#/components/schemas/RfqSubmitQuoteResponse'
    RfqWithdrawQuoteResponse:
      name: RfqWithdrawQuoteResponse
      title: rfq.withdraw_quote response
      payload:
        $ref: '#/components/schemas/RfqWithdrawQuoteResponse'
    RfqConfirmQuoteResponse:
      name: RfqConfirmQuoteResponse
      title: rfq.confirm_quote response
      payload:
        $ref: '#/components/schemas/RfqConfirmQuoteResponse'
    ErrorResponse:
      name: ErrorResponse
      title: error response
      payload:
        $ref: '#/components/schemas/ErrorResponse'
    BookTicker:
      name: BookTicker
      title: book ticker
      payload:
        $ref: '#/components/schemas/BookTicker'
    OrderBookSnapshot:
      name: OrderBookSnapshot
      title: order book snapshot
      payload:
        $ref: '#/components/schemas/OrderBookSnapshot'
    DepthUpdate:
      name: DepthUpdate
      title: L2 differential depth update
      payload:
        $ref: '#/components/schemas/DepthUpdate'
    Trade:
      name: Trade
      title: trade
      payload:
        $ref: '#/components/schemas/Trade'
    OrderUpdate:
      name: OrderUpdate
      title: order update
      payload:
        $ref: '#/components/schemas/OrderUpdate'
    BalanceUpdate:
      name: BalanceUpdate
      title: balance update
      payload:
        $ref: '#/components/schemas/BalanceUpdate'
    PositionReport:
      name: PositionReport
      title: position report
      payload:
        $ref: '#/components/schemas/PositionReport'
    ContractStatus:
      name: ContractStatus
      title: contract status
      payload:
        $ref: '#/components/schemas/ContractStatus'
    RfqPublicEvent:
      name: RfqPublicEvent
      title: public request-for-quote event
      payload:
        $ref: '#/components/schemas/RfqPublicEvent'
    RfqPrivateDelivery:
      name: RfqPrivateDelivery
      title: private request-for-quote delivery
      payload:
        $ref: '#/components/schemas/RfqPrivateDelivery'
  schemas:
    CorrelationId:
      description: Client-chosen id, echoed on the matching response.
      oneOf:
        - type: string
        - type: integer
    NanosecondTimestamp:
      type: integer
      format: int64
      description: |
        Unix timestamp in nanoseconds. Values exceed JavaScript's safe integer
        range; JavaScript clients that need exact values should parse
        losslessly.
    MillisecondTimestamp:
      type: integer
      format: int64
      description: Unix timestamp in milliseconds.
    DecimalString:
      type: string
      description: Decimal value encoded as a string.
    PriceLevel:
      type: array
      description: |
        `[price, quantity]` tuple; both values are decimal strings. A quantity
        of zero removes that price level in differential depth updates.
      items:
        type: string
      minItems: 2
      maxItems: 2
    RequestBase:
      type: object
      required: [id, method]
      properties:
        id:
          $ref: '#/components/schemas/CorrelationId'
        method:
          type: string
      additionalProperties: true
    ConninfoRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              const: conninfo
            params:
              type: object
              additionalProperties: true
    PingRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              const: ping
            params:
              type: object
              additionalProperties: true
    TimeRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              const: time
            params:
              type: object
              additionalProperties: true
    SubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              pattern: ^(SUBSCRIBE|subscribe)$
              description: |
                `SUBSCRIBE` for Prediction Markets docs; lowercase `subscribe`
                is also accepted by the shared Trading WebSocket docs.
            params:
              type: array
              description: Stream names to subscribe to.
              items:
                type: string
    UnsubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              pattern: ^(UNSUBSCRIBE|unsubscribe)$
              description: |
                `UNSUBSCRIBE` for Prediction Markets docs; lowercase
                `unsubscribe` is also accepted by the shared Trading WebSocket
                docs.
            params:
              type: array
              description: Stream names to unsubscribe from.
              items:
                type: string
    ListSubscriptionsRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              pattern: ^(LIST_SUBSCRIPTIONS|list_subscriptions)$
              description: |
                `LIST_SUBSCRIPTIONS` for Prediction Markets docs; lowercase
                `list_subscriptions` is also accepted by the shared Trading
                WebSocket docs.
            params:
              type: object
              additionalProperties: true
    DepthRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: depth
            params:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5000
                  default: 100
              additionalProperties: true
    OrderPlaceRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: order.place
            params:
              $ref: '#/components/schemas/OrderPlaceParams'
    OrderCancelRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: order.cancel
            params:
              $ref: '#/components/schemas/OrderCancelParams'
    OrderCancelAllRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              const: order.cancel_all
            params:
              type: object
              additionalProperties: true
    OrderCancelSessionRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method]
          properties:
            method:
              type: string
              const: order.cancel_session
            params:
              type: object
              additionalProperties: true
    RfqSubmitQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: rfq.submit_quote
            params:
              $ref: '#/components/schemas/RfqSubmitQuoteParams'
    RfqWithdrawQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: rfq.withdraw_quote
            params:
              $ref: '#/components/schemas/RfqWithdrawQuoteParams'
    RfqConfirmQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/RequestBase'
        - type: object
          required: [method, params]
          properties:
            method:
              type: string
              const: rfq.confirm_quote
            params:
              $ref: '#/components/schemas/RfqConfirmQuoteParams'
    ResponseBase:
      type: object
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/CorrelationId'
        status:
          type: integer
          description: HTTP-style status code.
      additionalProperties: true
    GenericSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              description: Method-specific result. Some utility result fields are not enumerated in the docs.
    ListSubscriptionsResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              type: array
              items:
                type: string
    DepthResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/OrderBookSnapshot'
    OrderActionResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              type: object
              description: |
                Method-specific order result. Order lifecycle state is carried
                authoritatively on the `orderUpdate` stream.
              additionalProperties: true
    RfqSubmitQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              type: object
              required: [rfqId, quoteId]
              properties:
                rfqId:
                  type: string
                quoteId:
                  type: string
              additionalProperties: true
    RfqWithdrawQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              type: object
              required: [rfqId, quoteId]
              properties:
                rfqId:
                  type: string
                quoteId:
                  type: string
              additionalProperties: true
    RfqConfirmQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          properties:
            result:
              type: object
              required: [rfqId, quoteId, confirmed]
              properties:
                rfqId:
                  type: string
                quoteId:
                  type: string
                confirmed:
                  type: boolean
              additionalProperties: true
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/WsError'
    WsError:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: Internal error code, e.g. -1002.
        msg:
          type: string
          description: Human-readable error message.
      additionalProperties: true
    OrderPlaceParams:
      type: object
      required: [symbol, side, type, timeInForce, quantity]
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        type:
          type: string
          enum: [LIMIT, MARKET]
          description: Use LIMIT with price and stopPrice for a stop-limit order. For this WebSocket contract, BUY stopPrice may be equal to or below price and SELL stopPrice may be equal to or above price. The order event reports its type as STOP_LIMIT. The legacy REST order endpoint has separate strict inequality rules.
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, MOC]
        price:
          $ref: '#/components/schemas/DecimalString'
        stopPrice:
          $ref: '#/components/schemas/DecimalString'
        quantity:
          $ref: '#/components/schemas/DecimalString'
        clientOrderId:
          type: string
        eventOutcome:
          type: string
          enum: [YES, NO]
          description: Required for prediction market event contracts.
      additionalProperties: true
    OrderCancelParams:
      type: object
      required: [orderId]
      properties:
        orderId:
          oneOf:
            - type: string
            - type: integer
      additionalProperties: true
    OrderBookSnapshot:
      type: object
      description: Snapshot payload used by partial depth streams and the `depth` method.
      required: [lastUpdateId, bids, asks]
      properties:
        lastUpdateId:
          type: integer
          format: int64
        bids:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
      additionalProperties: true
    BookTicker:
      type: object
      required: [u, E, s, b, B, a, A]
      properties:
        u:
          type: integer
          format: int64
          description: Update ID.
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        s:
          type: string
        b:
          $ref: '#/components/schemas/DecimalString'
        B:
          $ref: '#/components/schemas/DecimalString'
        a:
          $ref: '#/components/schemas/DecimalString'
        A:
          $ref: '#/components/schemas/DecimalString'
        c:
          $ref: '#/components/schemas/DecimalString'
          description: Last trade price, present once the book has traded.
        C:
          $ref: '#/components/schemas/DecimalString'
          description: Last trade size, present once the book has traded.
      additionalProperties: true
    DepthUpdate:
      type: object
      description: >
        L2 depth frame. With the `snapshot` connection parameter set — `-1` for the
        full book, a positive N for the top N levels — the FIRST frame after
        subscribing is the snapshot (b/a hold absolute levels, and U..u identifies
        the update range covered by the frame); every frame after it is an incremental
        diff. There is no separate snapshot message and no lastUpdateId field. Apply
        frames in order, using u as the last applied update ID; if a frame's U skips
        ahead of the last applied u, discard the book and resubscribe to resync.
      required: [e, E, s, U, u, b, a]
      properties:
        e:
          type: string
          const: depthUpdate
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        s:
          type: string
        U:
          type: integer
          format: int64
        u:
          type: integer
          format: int64
        b:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
        a:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
      additionalProperties: true
    Trade:
      type: object
      required: [E, s, t, p, q, m]
      properties:
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        s:
          type: string
        t:
          type: integer
          format: int64
        p:
          $ref: '#/components/schemas/DecimalString'
        q:
          $ref: '#/components/schemas/DecimalString'
        m:
          type: boolean
          description: Whether the buyer is the maker.
      additionalProperties: true
    OrderUpdate:
      type: object
      description: |
        Authenticated order lifecycle event. Fields with empty or zero values may
        be omitted from the event.
      required: [e, E, s, i, X, T]
      properties:
        e:
          type: string
          const: orderUpdate
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        s:
          type: string
        i:
          type: integer
          format: int64
        c:
          type: string
          description: Client order ID. For RFQ maker fills, this is the clientId supplied to rfq.submit_quote, or Gemini's deterministic RFQ client order ID when clientId is omitted.
        S:
          type: string
          enum: [BUY, SELL]
        o:
          type: string
          enum: [LIMIT, MARKET, STOP_LIMIT, STOP_MARKET]
        X:
          type: string
          enum: [NEW, OPEN, FILLED, PARTIALLY_FILLED, CANCELED, REJECTED, MODIFIED]
        O:
          type: string
          enum: [YES, NO]
          description: Event outcome for prediction market contracts.
        p:
          $ref: '#/components/schemas/DecimalString'
        P:
          $ref: '#/components/schemas/DecimalString'
          description: Stop price, `0` when not a stop order.
        q:
          $ref: '#/components/schemas/DecimalString'
        z:
          $ref: '#/components/schemas/DecimalString'
          description: Remaining quantity.
        Z:
          $ref: '#/components/schemas/DecimalString'
          description: |
            Executed quantity. For `FILLED` / `PARTIALLY_FILLED`, this is the
            last execution quantity. For `CANCELED` and other events, this is
            cumulative executed quantity over the order lifetime.
        L:
          $ref: '#/components/schemas/DecimalString'
        t:
          type: integer
          format: int64
        n:
          $ref: '#/components/schemas/DecimalString'
          description: Fee amount, only present on fill events.
        m:
          type: boolean
          description: Maker flag on fills.
        r:
          type: string
          description: Rejection or cancellation reason.
        T:
          $ref: '#/components/schemas/NanosecondTimestamp'
      additionalProperties: true
    BalanceUpdate:
      type: object
      required: [e, E, u, B]
      properties:
        e:
          type: string
          const: balanceUpdate
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        u:
          $ref: '#/components/schemas/NanosecondTimestamp'
        B:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
      additionalProperties: true
    Balance:
      type: object
      required: [a, f, c]
      properties:
        a:
          type: string
          description: Asset code.
        f:
          $ref: '#/components/schemas/DecimalString'
        c:
          $ref: '#/components/schemas/DecimalString'
      additionalProperties: true
    PositionReport:
      type: object
      required: [e, E, u, A, P]
      properties:
        e:
          type: string
          const: positionReport
        E:
          $ref: '#/components/schemas/NanosecondTimestamp'
        u:
          $ref: '#/components/schemas/NanosecondTimestamp'
        A:
          type: integer
          format: int64
          description: Account ID.
        P:
          type: array
          items:
            $ref: '#/components/schemas/PositionRow'
      additionalProperties: true
    PositionRow:
      type: object
      required: [t, s, a]
      properties:
        t:
          type: string
          description: Product type; event contracts use `ec`.
        s:
          type: string
        a:
          type: array
          items:
            $ref: '#/components/schemas/NamedAmount'
      additionalProperties: true
    NamedAmount:
      type: object
      required: [t, v]
      properties:
        t:
          type: string
          description: Amount label, such as `position` or `settlement_payout`.
        v:
          $ref: '#/components/schemas/DecimalString'
          description: Decimal amount. The `position` amount is a signed quantity; `settlement_payout` is the settlement payout.
        c:
          type: string
          description: Optional asset code, such as `usd` for settlement payouts.
        o:
          type: string
          enum: [YES, NO, UNSPECIFIED]
          description: Settlement outcome. Present on `settlement_payout` amounts in terminal event-contract position rows.
      additionalProperties: true
    ContractStatus:
      type: object
      required: [e, E, s, k, c, i, o, n]
      properties:
        e:
          type: string
          const: contractStatus
        E:
          $ref: '#/components/schemas/MillisecondTimestamp'
        s:
          type: string
        k:
          type: string
          description: Event ticker.
        c:
          type: string
          description: Contract ticker.
        i:
          type: integer
          format: int64
        p:
          $ref: '#/components/schemas/DecimalString'
          description: Strike price, omitted for Up/Down contracts until populated.
        o:
          type: string
          description: Previous status.
        n:
          type: string
          description: New status.
      additionalProperties: true
    RfqClientId:
      type: string
      description: Optional client order ID for tracking the maker fill. It is emitted as the fill event's c field. It must contain only printable ASCII characters and be at most 36 characters. Keep it unique for the maker account because the venue does not deduplicate it.
    RfqSubmitQuoteParams:
      type: object
      required: [rfqId, price, quantity]
      properties:
        rfqId:
          type: string
        price:
          $ref: '#/components/schemas/DecimalString'
        quantity:
          $ref: '#/components/schemas/DecimalString'
        validUntil:
          $ref: '#/components/schemas/MillisecondTimestamp'
        clientId:
          $ref: '#/components/schemas/RfqClientId'
      additionalProperties: true
    RfqWithdrawQuoteParams:
      type: object
      required: [rfqId, quoteId]
      properties:
        rfqId:
          type: string
        quoteId:
          type: string
      additionalProperties: true
    RfqConfirmQuoteParams:
      type: object
      required: [rfqId, quoteId, confirm]
      properties:
        rfqId:
          type: string
        quoteId:
          type: string
        confirm:
          type: boolean
      additionalProperties: true
    RfqLeg:
      type: object
      required: [c, o]
      properties:
        c:
          type: string
          description: CMS contract id.
        o:
          type: string
          enum: [YES, NO]
        s:
          type: string
          description: This leg's own instrument symbol, when available. Distinct from the combo-level `s` on the enclosing event.
          example: "GEMI-XRPUSD-260828"
      additionalProperties: true
    RfqLifecycleState:
      type: string
      enum: [OPEN, PENDING_ACCEPTANCE, CONFIRMING, FINALIZING, FINALIZED, CANCELLED, EXPIRED, FAILED]
    RfqQuoteStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN, EXPIRED, WON, LOST]
    RfqPublicEvent:
      type: object
      required: [e, E, r, l, S]
      properties:
        e:
          type: string
          const: requestForQuote
        E:
          $ref: '#/components/schemas/MillisecondTimestamp'
        r:
          type: string
          description: RFQ ID.
        s:
          type: string
          description: The combo's deterministic instrument symbol, when available. Market makers can use it to place a CLOB order on the combo, activating its book on demand.
        l:
          type: array
          items:
            $ref: '#/components/schemas/RfqLeg'
        n:
          $ref: '#/components/schemas/DecimalString'
          description: Requested notional size, mutually exclusive with `q`.
        q:
          $ref: '#/components/schemas/DecimalString'
          description: Requested contract quantity, mutually exclusive with `n`. The RFQ quantity grid can be whole contracts or 0.01 fractional contracts.
        f:
          $ref: '#/components/schemas/DecimalString'
          description: Execution quantity calculated when the requester accepts.
        S:
          $ref: '#/components/schemas/RfqLifecycleState'
        w:
          $ref: '#/components/schemas/MillisecondTimestamp'
        x:
          $ref: '#/components/schemas/MillisecondTimestamp'
        c:
          $ref: '#/components/schemas/MillisecondTimestamp'
      additionalProperties: true
    RfqPrivateDelivery:
      type: object
      required: [e, i, E, r, x, S]
      properties:
        e:
          type: string
          const: requestForQuote
        i:
          type: string
          description: Durable lifecycle-event UUID for at-least-once deduplication.
        E:
          $ref: '#/components/schemas/MillisecondTimestamp'
        r:
          type: string
          description: RFQ ID.
        x:
          type: string
          enum: [CLOSED, ACCEPTED, CONFIRMED, DECLINED, FINALIZED, FAILED]
          description: Customer-visible lifecycle transition.
        S:
          $ref: '#/components/schemas/RfqLifecycleState'
        q:
          type: string
          description: Quote ID on authenticated delivery streams.
        p:
          $ref: '#/components/schemas/DecimalString'
        sz:
          $ref: '#/components/schemas/DecimalString'
        qs:
          $ref: '#/components/schemas/RfqQuoteStatus'
        vu:
          $ref: '#/components/schemas/MillisecondTimestamp'
      additionalProperties: true
