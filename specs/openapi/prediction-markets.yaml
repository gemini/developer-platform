  /v1/prediction-markets/positions:
    post:
      tags:
        - Positions
      summary: Get positions
      description: |
        Returns current filled positions for the authenticated user. All query parameters are optional; omitting them preserves the legacy unpaginated, unsorted behavior.
      operationId: getPositions
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      parameters:
        - name: eventTicker
          in: query
          required: false
          description: Filter positions to a single event ticker (e.g. `FEDJAN26`). Positions on sub-events whose `parentEventTicker` matches the value may also be included.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of positions to return. Clamped to `[1, 1000]` when supplied. Omit for legacy unpaginated behavior.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: Number of positions to skip for pagination. Floor-clamped to `0` when supplied. Ignored when `limit` is omitted (the response is unpaginated).
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          required: false
          description: |
            Sort order. Accepts `positionValue`, `unrealizedPnl`, or `expiryDate` (case-insensitive), optionally prefixed with `+` (ascending) or `-` (descending). A bare field name uses each field's default direction: `positionValue` and `unrealizedPnl` default to descending; `expiryDate` defaults to ascending (soonest-first). `unrealizedPnl` and `expiryDate` sort NULLS LAST so positions without the sort key sink to the bottom regardless of direction. `instrumentId` ascending is the final tiebreaker for stable pagination across quote ticks. A malformed `sort` value silently falls back to `-positionValue` — no `400` is returned.
          schema:
            type: string
            enum:
              - positionValue
              - '+positionValue'
              - '-positionValue'
              - unrealizedPnl
              - '+unrealizedPnl'
              - '-unrealizedPnl'
              - expiryDate
              - '+expiryDate'
              - '-expiryDate'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
              examples:
