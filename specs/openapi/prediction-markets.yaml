  /v1/prediction-markets/orders/history:
    post:
      tags:
        - Positions
      summary: Get order history
      description: >-
        Returns historical orders (filled or cancelled) for the authenticated user. Use `status: filled` with `from` and `to` to retrieve fully filled orders in a bounded time window. The range is `[from, to)`: `from` is inclusive and `to` is exclusive. A time-bounded response contains at most `limit` results and ignores `offset`; split high-volume periods into non-overlapping ranges. Use `/orders/active` for open orders.
      operationId: getOrderHistory
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Filter by order status
                  enum: [filled, cancelled]
                symbol:
                  type: string
                  description: Filter by contract instrument symbol
                  example: "GEMI-FEDJAN26-DN25"
                limit:
                  type: integer
                  description: Maximum number of results to return. Defaults to 50 and is capped at 1000.
                  default: 50
                  minimum: 1
                  maximum: 1000
                offset:
                  type: integer
                  description: Number of results to skip for pagination. Offset is ignored when `from` or `to` is supplied.
                  default: 0
                  minimum: 0
                  maximum: 10000
                from:
                  type: integer
                  format: int64
                  description: Inclusive start of the order-closed time range, expressed as Unix epoch milliseconds. Use with `to` for a UTC daily window.
                  example: 1775001600000
                to:
                  type: integer
                  format: int64
                  description: Exclusive end of the order-closed time range, expressed as Unix epoch milliseconds. `from` must not be later than `to`.
                  example: 1775088000000
      responses:
        '200':
