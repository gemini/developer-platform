components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-GEMINI-APIKEY
      description: Gemini API key with appropriate permissions
    payloadAuth:
      type: apiKey
      in: header
      name: X-GEMINI-PAYLOAD
      description: Base64-encoded private REST payload. See Gemini private REST authentication.
    signatureAuth:
      type: apiKey
      in: header
      name: X-GEMINI-SIGNATURE
      description: Hex HMAC-SHA384 signature of the payload using the API secret.

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of results to return (max 500)
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
    SportFilter:
      name: sport
      in: query
      description: Filter by `sportsMarket.sport`. Repeat the parameter to match any supplied value (OR). Sports-market filters compose independently using AND. Unsupported enum values return `400 Bad Request`; valid combinations with no matching events return an empty result.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SportsMarketSport'
      style: form
      explode: true
    SportsMarketTypeFilter:
      name: sports_market_type
      in: query
      description: Filter by `sportsMarket.type`. Repeat the parameter to match any supplied value (OR). Sports-market filters compose independently using AND. Unsupported enum values return `400 Bad Request`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SportsMarketType'
      style: form
      explode: true
    SportsMarketSubjectFilter:
      name: sports_market_subject
      in: query
      description: Filter by `sportsMarket.subject`. Repeat the parameter to match any supplied value (OR). Sports-market filters compose independently using AND. Unsupported enum values return `400 Bad Request`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SportsMarketSubject'
      style: form
      explode: true
    SportsMarketScopeFilter:
      name: sports_market_scope
      in: query
      description: Filter by `sportsMarket.scope.type`. Repeat the parameter to match any supplied value (OR). Ordinal and range qualifiers are not inferred by this filter. Sports-market filters compose independently using AND. Unsupported enum values return `400 Bad Request`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SportsMarketScopeType'
      style: form
      explode: true
    SportsMarketMetricFilter:
      name: sports_market_metric
      in: query
      description: Filter by `sportsMarket.metric`. Repeat the parameter to match any supplied value (OR). A metric can be queried without `sport`; use `sport` when its sport-specific meaning matters. Sports-market filters compose independently using AND. Unsupported enum values return `400 Bad Request`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SportsMarketMetric'
      style: form
      explode: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Prediction markets feature is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: "InvalidInput"
        message:
          type: string
          description: Human-readable error message
          example: "orderId is required"

    PredictionMarketsError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Prediction Markets error class
          example: "InvalidInput"
        field:
          type: string
          description: Request field associated with the error, when available
          example: "orders"
        message:
          type: string
          description: Human-readable error detail, when available
          example: "orders must contain between 1 and 20 entries"

    AuthErrorResponse:
      type: object
      additionalProperties: false
      required:
        - result
        - reason
        - message
      properties:
        result:
          type: string
          enum: [error]
        reason:
          type: string
          description: Authentication or authorization error class
          example: "MissingNonce"
        message:
          type: string
          description: Human-readable authentication or authorization detail
          example: "Must provide unique monotonic increasing 'nonce' field in payload"

    AccountGroupBlockedError:
      type: object
      additionalProperties: false
      required:
        - error
        - code
      properties:
        error:
          type: string
          enum: ["This account is not permitted to trade prediction markets"]
        code:
          type: string
          enum: [ACCOUNT_GROUP_BLOCKED]

    TermsNotAcceptedError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: [TERMS_NOT_ACCEPTED]
        message:
          type: string
          enum: ["Prediction markets terms must be accepted before placing orders"]

    RestrictedSellOnlyError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: [ACCOUNT_RESTRICTED_SELL_ONLY]
        message:
          type: string
          enum: ["Your account is restricted to selling existing positions; buying is not permitted."]

    PredictionMarketsTerms:
      type: object
      required:
        - termsType
        - version
        - content
        - updatedAt
      properties:
        termsType:
          type: string
          description: Terms type identifier
          example: "PredictionsMarket"
        version:
          type: integer
          description: Latest terms version
          example: 3
        content:
          type: string
          description: Terms content to display before acceptance
          example: "These are the prediction market terms."
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp when the terms content was last updated
          example: "2026-05-18T17:00:00Z"

    PredictionMarketsTermsStatus:
      type: object
      required:
        - hasAcceptedLatest
      properties:
        hasAcceptedLatest:
          type: boolean
          description: Whether the account group has accepted the latest configured Prediction Markets terms
          example: false
        acceptedVersion:
          type: integer
          nullable: true
          description: Latest terms version accepted by the account group, if any
          example: 2
        latestVersion:
          type: integer
          nullable: true
          description: Latest configured Prediction Markets terms version, if available
          example: 3

    AcceptPredictionMarketsTermsResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    MarketStatus:
      type: string
      enum: [approved, active, closed, under_review, settled, invalid]
      description: Status of a prediction market

    MarketType:
      type: string
      enum: [binary, categorical]
      description: Type of prediction market

    SportsMarketSport:
      type: string
      enum: [american_football, athletics, australian_rules_football, baseball, basketball, boxing, chess, cricket, cycling, darts, esports, golf, hockey, lacrosse, mixed_martial_arts, motorsports, rugby, sailing, soccer, tennis]
      description: Sport whose rules give the market's scope and metric their sport-specific meaning.

    SportsMarketType:
      type: string
      enum: [moneyline, spread, total, prop, correct_score, to_advance, futures, other]
      description: Conventional sports-market family. `subject`, `scope`, and `metric` provide detail within the family. This classification is independent of the event's structural `type` (`binary` or `categorical`).

    SportsMarketSubject:
      type: string
      enum: [contest, team, player, participant, other]
      description: What the market is about. `participant` covers non-player entrants such as drivers and horses.

    SportsMarketScopeType:
      type: string
      enum: [full_contest, regulation, half, quarter, period, inning, team_innings, over, powerplay, set, game, round, hole, match_day, session, super_over, race, sprint, qualifying, practice, stage, lap, series, season, tournament, competition, other]
      description: Unit covered by the market. `full_contest` follows the market's official final-result rules; `regulation` covers scheduled regulation play only. Ordinal and range qualifiers are represented separately on `SportsMarketScope`.

    SportsMarketMetric:
      type: string
      description: Statistic measured by the market. Interpret shared metric names using `sportsMarket.sport`.
      enum:
        - aces
        - assists
        - balls_faced
        - birdies
        - blocked_shots
        - blocks
        - bogeys
        - boundaries
        - break_points_won
        - cards
        - catches
        - clean_sheets
        - completed_passes
        - control_time
        - corners
        - defensive_rebounds
        - double_double
        - double_faults
        - doubles
        - eagles
        - earned_runs
        - errors
        - faceoff_wins
        - fairways_hit
        - fantasy_points
        - fastest_lap
        - field_goals_made
        - finishing_position
        - fouls
        - fours
        - free_throws_made
        - fumbles
        - games
        - goals
        - goals_allowed
        - greens_in_regulation
        - grid_position
        - hits
        - hits_allowed
        - hits_runs_rbis
        - holes_in_one
        - home_runs
        - innings_pitched
        - interceptions_thrown
        - kicking_points
        - knockdowns
        - laps_completed
        - laps_led
        - lap_time
        - longest_pass_completion
        - longest_reception
        - longest_rush
        - maiden_overs
        - offensive_rebounds
        - offsides
        - pars
        - passes
        - pass_attempts
        - pass_completions
        - passing_touchdowns
        - passing_yards
        - penalty_minutes
        - pitching_outs_recorded
        - pit_stops
        - points
        - points_assists
        - points_rebounds
        - points_rebounds_assists
        - positions_gained
        - power_play_points
        - putts
        - qualifying_position
        - rebounds
        - rebounds_assists
        - receiving_touchdowns
        - receiving_yards
        - receptions
        - red_cards
        - retirements
        - rounds
        - runs
        - runs_batted_in
        - runs_conceded
        - rush_attempts
        - rushing_touchdowns
        - rushing_yards
        - sacks
        - safety_cars
        - saves
        - sets
        - shots
        - shots_on_goal
        - shots_on_target
        - shutouts
        - significant_strikes
        - singles
        - sixes
        - steals
        - stolen_bases
        - strokes
        - strikeouts
        - submission_attempts
        - tackles
        - takedowns
        - three_pointers_made
        - tiebreaks_won
        - total_bases
        - total_points_won
        - total_strikes
        - touchdowns
        - triples
        - triple_double
        - turnovers
        - walks
        - wickets
        - wins
        - yellow_cards
        - other

    SportsMarketScope:
      type: object
      additionalProperties: false
      description: Settlement scope. `ordinal` identifies one unit; `start` and `end` identify an inclusive range of units.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/SportsMarketScopeType'
        ordinal:
          type: integer
          format: int32
          minimum: 0
          description: Optional ordinal within the scope type, such as half `1` or quarter `4`.
        start:
          type: integer
          format: int32
          minimum: 0
          description: Optional inclusive start of a scope range, such as inning `1`.
        end:
          type: integer
          format: int32
          minimum: 0
          description: Optional inclusive end of a scope range, such as inning `5`.

    SportsMarket:
      type: object
      additionalProperties: false
      description: Atomic sports-market classification shared by every contract grouped under the event. Present only for sports events. All fields except `metric` are required together.
      required:
        - sport
        - type
        - subject
        - scope
      properties:
        sport:
          $ref: '#/components/schemas/SportsMarketSport'
        type:
          $ref: '#/components/schemas/SportsMarketType'
        subject:
          $ref: '#/components/schemas/SportsMarketSubject'
        scope:
          $ref: '#/components/schemas/SportsMarketScope'
        metric:
          $ref: '#/components/schemas/SportsMarketMetric'

    OrderType:
      type: string
      enum: [limit, stop-limit]
      description: Order type. `stop-limit` orders require a `stopPrice` that triggers a limit order at `price` when the market reaches the trigger.

    OrderSide:
      type: string
      enum: [buy, sell]

    Outcome:
      type: string
      enum: ["yes", "no"]
      description: The outcome being traded (Yes or No)

    TimeInForce:
      type: string
      enum: [good-til-cancel, immediate-or-cancel, fill-or-kill]
      default: good-til-cancel
      description: |
        Order execution behavior:
        - `good-til-cancel` - Order remains active until filled or cancelled (default)
        - `immediate-or-cancel` - Fill immediately or cancel remaining
        - `fill-or-kill` - Fill entire order immediately or cancel

    OrderStatus:
      type: string
      enum: [open, filled, cancelled]

    PositionStatus:
      type: string
      enum: [active, resolved, cancelled]

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 100

    PaginationSimple:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        count:
          type: integer
          description: Number of items in current response

    OrderBook:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookEntry'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookEntry'

    OrderBookEntry:
      type: object
      properties:
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          type: string
          example: "0.65"
        quantity:
          type: string
          example: "1000"

    OrderBookDepth:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        lastUpdateTime:
          type: string
          format: date-time

    OrderBookLevel:
      type: object
      properties:
        price:
          type: string
        quantity:
          type: string
        orderCount:
          type: integer

    Contract:
      type: object
      description: |
        Contract quantity and price validation is instrument-specific. Clients must validate order quantities and prices against the returned increment and minimum fields rather than assuming a fixed grid.
      properties:
        id:
          type: string
        label:
          type: string
          description: Human-readable label for the contract's YES-space proposition (e.g., "SOL > $90")
        abbreviatedName:
          type: string
          nullable: true
          description: Short form label (e.g., ">$90")
        description:
          type: object
          description: Rich text description
        prices:
          $ref: '#/components/schemas/ContractPrices'
        color:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MarketStatus'
        imageUrl:
          type: string
          nullable: true
        priceHistory:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PricePoint'
        createdAt:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
          nullable: true
        resolutionSide:
          $ref: '#/components/schemas/Outcome'
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        termsAndConditionsUrl:
          type: string
        ticker:
          type: string
        instrumentSymbol:
          type: string
        quantityIncrement:
          type: string
          nullable: true
          description: Contract quantity grid from instrument refdata (for example, "0.01").
        quantityMinimum:
          type: string
          nullable: true
          description: Minimum contract quantity from instrument refdata (for example, "1.00").
        priceIncrement:
          type: string
          nullable: true
          description: Contract price grid from instrument refdata (for example, "0.0001").
        quoteAssetPrecision:
          type: integer
          nullable: true
          description: Decimal places supported by the instrument's quote asset.
        priceMinimum:
          type: string
          nullable: true
          description: Minimum contract price and anchor for the instrument price grid (for example, "0.0001").
        effectiveDate:
          type: string
          format: date-time
          nullable: true
        marketState:
          type: string
          nullable: true
          description: Trading state of the contract
          enum: [open, closed]
        sortOrder:
          type: integer
          nullable: true
          description: Display order within the event
        strike:
          $ref: '#/components/schemas/Strike'
        source:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated: use the event-level `sourceDetails` (`agency` + `index`) instead. Data source identifier for price observation (e.g., "GRR-KAIKO_BTCUSD_60S"). Present for crypto Up/Down contracts.'
          example: "GRR-KAIKO_BTCUSD_60S"
        settlementValue:
          type: string
          nullable: true
          description: The observed settlement price. Only present after the contract is settled.
          example: "87654.32"

    StrikeType:
      type: string
      description: >-
        Strike or condition inequality type for contract threshold evaluation.
        - `reference`: Crypto Up/Down reference strike price captured at `availableAt` time.
        - `above`: Higher/Lower contract threshold.
        - `spread`: Point, run, or goal handicap spread line.
        - `over`: Total or prop threshold evaluated as strict greater than (`>`).
        - `over_or_equal`: Total or prop threshold evaluated as greater than or equal to (`>=`).
        - `under`: Total or prop threshold evaluated as strict less than (`<`).
        - `under_or_equal`: Position, rank, or total threshold evaluated as less than or equal to (`<=`).
      enum:
        - reference
        - above
        - spread
        - over
        - over_or_equal
        - under
        - under_or_equal
      example: "spread"

    Strike:
      type: object
      description: Strike price or contract threshold information for Up/Down crypto contracts and sports prediction market contracts.
      properties:
        value:
          type: string
          nullable: true
          description: >-
            The strike price value. Null for "reference" type strikes where the value is determined at availableAt time.
            For sports contracts, this represents the derived numeric strike value (e.g. spread margin, total line, or position/rank threshold).
          example: "87500.00"
        type:
          $ref: '#/components/schemas/StrikeType'
        availableAt:
          type: string
          format: date-time
          nullable: true
          description: When the strike price becomes available
          example: "2026-03-27T19:45:00.000Z"

    SourceDetails:
      type: object
      nullable: true
      description: >-
        Structured data source information for price observation. Replaces the deprecated
        flat `source` string on the event and contract. Present for crypto Up/Down events.
        Both fields are omitted when not available.
      properties:
        agency:
          type: string
          nullable: true
          description: The data provider / vendor name.
          example: "Kaiko"
        index:
          type: string
          nullable: true
          description: The specific data feed identifier (the value previously carried by the flat `source` field).
          example: "GRR-KAIKO_BTCUSD_60S"

    PricePoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          type: string

    ContractPrices:
      type: object
      nullable: true
      description: Current bid/ask pricing for the contract
      properties:
        buy:
          type: object
          description: Buy prices for each outcome
          properties:
            "yes":
              type: string
              description: Price to buy YES outcome
              example: "0.42"
            "no":
              type: string
              description: Price to buy NO outcome
              example: "0.58"
        sell:
          type: object
          description: Sell prices for each outcome
          properties:
            "yes":
              type: string
              description: Price to sell YES outcome
              example: "0.42"
            "no":
              type: string
              description: Price to sell NO outcome
              example: "0.58"
        bestBid:
          type: string
          nullable: true
          description: Highest buy offer
          example: "0.49"
        bestAsk:
          type: string
          nullable: true
          description: Lowest sell offer
          example: "0.54"
        lastTradePrice:
          type: string
          nullable: true
          description: Most recent transaction price
          example: "0.75"

    Event:
      type: object
      description: A prediction market event containing one or more tradeable contracts
      properties:
        id:
          type: string
        title:
          type: string
          example: "Will Bitcoin reach $100k by end of 2028?"
        slug:
          type: string
          example: "bitcoin-100k-2028"
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/MarketType'
        category:
          type: string
          example: "crypto"
        series:
          type: string
          nullable: true
        sportsMarket:
          $ref: '#/components/schemas/SportsMarket'
        ticker:
          type: string
          description: The event ticker (e.g., "BTC100K2028")
          example: "BTC100K2028"
        status:
          $ref: '#/components/schemas/MarketStatus'
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        contracts:
          type: array
          description: Tradeable contracts within this event
          items:
            $ref: '#/components/schemas/Contract'
        contractOrderbooks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OrderBook'
        volume:
          type: string
          description: Total trading volume in USD
          example: "125000.00"
        liquidity:
          type: string
          description: Total liquidity in USD
          example: "50000.00"
        tags:
          type: array
          nullable: true
          items:
            type: string
        effectiveDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
          nullable: true
        subcategory:
          $ref: '#/components/schemas/Subcategory'
        source:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated: use `sourceDetails` (`agency` + `index`) instead. Data source identifier for price observation. Aggregated from contracts for crypto Up/Down events.'
          example: "GRR-KAIKO_BTCUSD_60S"
        sourceDetails:
          $ref: '#/components/schemas/SourceDetails'
        settlement:
          $ref: '#/components/schemas/Settlement'

    Subcategory:
      type: object
      nullable: true
      description: Nested category information for the event
      properties:
        id:
          type: integer
          description: Category identifier
          example: 35
        slug:
          type: string
          description: URL-friendly category identifier
          example: "crypto_solana"
        name:
          type: string
          description: Display name
          example: "Solana"
        path:
          type: array
          description: Category hierarchy path
          items:
            type: string
          example: ["Crypto", "Solana"]

    Settlement:
      type: object
      description: Settlement information for resolved events
      properties:
        value:
          type: string
          nullable: true
          description: The observed settlement value (e.g., the price at expiry for crypto contracts)
          example: "87654.32"

    EventsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ContractMetadata:
      type: object
      properties:
        contractId:
          type: string
        contractName:
          type: string
        contractTicker:
          type: string
        eventTicker:
          type: string
        eventName:
          type: string
        category:
          type: string
        contractStatus:
          type: string
        eventType:
          type: string
          description: Event type ("binary" or "categorical")
        expiryDate:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolutionSide:
          type: string
          nullable: true
          description: Winning outcome if resolved ("yes" or "no")
        parentEventTicker:
          type: string
          nullable: true
          description: Parent event ticker for sub-events
        startTime:
          type: string
          format: date-time
          nullable: true
          description: Start datetime (ISO 8601)

    ComboLeg:
      type: object
      required:
        - comboId
        - legIndex
        - contractId
        - requiredOutcome
      properties:
        comboId:
          type: integer
          format: int64
          description: Internal ID of the parent combo contract
          example: 456
        legIndex:
          type: integer
          description: Zero-based position of this leg in the combo
          example: 0
        contractId:
          type: string
          description: Internal ID of the underlying single contract, represented as a decimal string
          example: "101"
        requiredOutcome:
          type: string
          enum: ["Yes", "No"]
          description: The outcome this leg must settle for the combo to settle YES
          example: "Yes"
        legOutcome:
          type: string
          nullable: true
          description: The outcome this leg has settled to, if resolved (`"Yes"` or `"No"`). Null while the leg is still active.
          example: null
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp when this leg resolved. Null while still active.
          example: null
        contract:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContractMetadata'
          description: Full metadata for the underlying single contract

    ComboResponse:
      type: object
      required:
        - contract
        - legs
      properties:
        contract:
          allOf:
            - $ref: '#/components/schemas/ContractMetadata'
          description: Metadata for the combo contract itself (ticker, status, expiry, etc.)
        legs:
          type: array
          description: Ordered list of legs that make up this combo
          items:
            $ref: '#/components/schemas/ComboLeg'

    ListCombosResponse:
      type: object
      required:
        - combos
        - pagination
      properties:
        combos:
          type: array
          description: List of combo contracts matching the query
          items:
            $ref: '#/components/schemas/ComboResponse'
        pagination:
          allOf:
            - $ref: '#/components/schemas/Pagination'

    CreateComboRequest:
      type: object
      description: A canonical combo definition. The authenticated account is derived from the signed request and is not a request field.
      required:
        - legs
      properties:
        legs:
          type: array
          description: Two to six distinct underlying contract legs. The service canonicalizes their complete set, so leg order does not create a distinct combo.
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/CreateComboLeg'

    CreateComboLeg:
      type: object
      required:
        - contractId
        - requiredOutcome
      properties:
        contractId:
          type: string
          description: Underlying contract ID as a decimal string.
          example: "101"
        requiredOutcome:
          type: string
          enum: ["Yes", "No"]
          description: Required settlement outcome for this leg.
          example: "Yes"

    CreateComboResponse:
      type: object
      required:
        - combo
        - alreadyExisted
      properties:
        combo:
          $ref: '#/components/schemas/ComboSummary'
        alreadyExisted:
          type: boolean
          description: "`false` when this request created the canonical combo; `true` when the canonical combo already existed."

    ComboSummary:
      type: object
      required:
        - id
        - canonicalLegKey
        - legCount
        - instrumentRegistered
        - legs
      properties:
        id:
          type: integer
          format: int64
          description: Internal combo ID.
          example: 456
        canonicalLegKey:
          type: string
          description: Canonical identity of the complete combo leg set.
          example: "101:Yes|202:No"
        legCount:
          type: integer
          format: int32
          description: Number of legs in the combo.
          example: 2
        displayName:
          type: string
          description: Human-readable combo name, when available.
        status:
          type: string
          description: Current combo status, when available.
        instrumentId:
          type: integer
          format: int64
          description: Associated instrument ID, when available.
        instrumentSymbol:
          type: string
          description: Associated instrument symbol, when available.
          example: "GEMI-CMB-0526-A7F3B2C1D4E5"
        instrumentRegistered:
          type: boolean
          description: Whether the combo has been registered with an instrument symbol.
        latestExpiryDate:
          type: string
          format: date-time
          description: Latest expiry among the underlying legs, when available.
        createdAt:
          type: string
          format: date-time
          description: Creation time, when available.
        updatedAt:
          type: string
          format: date-time
          description: Most recent update time, when available.
        legs:
          type: array
          description: Canonically ordered combo legs.
          items:
            $ref: '#/components/schemas/ComboSummaryLeg'

    ComboSummaryLeg:
      type: object
      required:
        - comboId
        - legIndex
        - contractId
        - requiredOutcome
      properties:
        comboId:
          type: integer
          format: int64
          description: Parent combo ID.
        legIndex:
          type: integer
          format: int32
          description: Zero-based leg position in canonical order.
        contractId:
          type: string
          description: Underlying contract ID as a decimal string.
        requiredOutcome:
          type: string
          enum: ["Yes", "No"]
          description: Required settlement outcome for the leg.
        legOutcome:
          type: string
          enum: ["Yes", "No"]
          nullable: true
          description: Settled outcome for the leg, when resolved.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: Resolution time for the leg, when resolved.
        contract:
          allOf:
            - $ref: '#/components/schemas/ContractMetadata'
          description: Underlying contract metadata, when available.

    ComboWriteError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error class.
          example: "InvalidInput"
        code:
          type: string
          description: Machine-readable code for validation or missing-leg errors, when available.
          example: "COMBO_VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error detail.
          example: "a combo needs 2-6 legs"

    OrderRequest:
      type: object
      required:
        - symbol
        - orderType
        - side
        - quantity
        - price
        - outcome
      properties:
        symbol:
          type: string
          description: Contract instrument symbol
          example: "GEMI-FEDJAN26-DN25"
        orderType:
          $ref: '#/components/schemas/OrderType'
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: string
          format: decimal
          description: Number of contracts
          example: "100"
        price:
          type: string
          format: decimal
          description: Limit price (0-1 range)
          example: "0.65"
        stopPrice:
          type: string
          format: decimal
          description: The price to trigger a stop-limit order (0-1 range). Only available for stop-limit orders. See [Stop-Limit Orders](#operation/placeOrder) above for `stopPrice`/`price` constraints.
          example: "0.60"
        outcome:
          $ref: '#/components/schemas/Outcome'
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        makerOrCancel:
          type: boolean
          description: Set to `true` to require maker-only behavior. If the order would immediately take liquidity, the order is cancelled instead of filling.
          default: false

    PlaceOrderBatchRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 20
          description: Orders to submit. Every entry is validated before any order is submitted. All orders use the account associated with the authenticated request.
          items:
            $ref: '#/components/schemas/OrderRequest'

    BatchOrderResponse:
      type: object
      description: An accepted order returned for one batch entry.
      required:
        - orderId
        - status
        - symbol
        - side
        - outcome
        - orderType
        - timeInForce
        - quantity
        - filledQuantity
        - remainingQuantity
        - price
        - createdAt
        - updatedAt
      properties:
        orderId:
          type: integer
          format: int64
          example: 12345678
        hashOrderId:
          type: string
          description: Hashed order ID; omitted when unavailable
        clientOrderId:
          type: string
          description: Client-provided order ID; omitted when unavailable
        globalOrderId:
          type: string
          description: Global order ID; omitted when unavailable
        status:
          type: string
          enum: [open, filled, cancelled, closed]
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        outcome:
          $ref: '#/components/schemas/Outcome'
        orderType:
          $ref: '#/components/schemas/OrderType'
        timeInForce:
          type: string
          enum: [good-til-cancel, immediate-or-cancel, fill-or-kill, maker-or-cancel]
        quantity:
          type: string
          description: Original order quantity
        filledQuantity:
          type: string
          description: Amount filled so far
        remainingQuantity:
          type: string
          description: Amount remaining to fill
        price:
          type: string
          description: Limit price
        stopPrice:
          type: string
          description: Stop trigger price; omitted unless populated for a `stop-limit` order
        avgExecutionPrice:
          type: string
          description: Average price of fills; omitted when unavailable
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          description: Cancellation time; omitted unless the order was cancelled
        contractMetadata:
          $ref: '#/components/schemas/ContractMetadata'
        promoCashApplied:
          type: string
          description: Promotional cash reserved or applied to the order; omitted when unavailable
        fundsOnHold:
          type: string
          description: Cash reserved for the unfilled portion of a resting buy order; omitted when unavailable

    PlaceOrderBatchSuccessResult:
      type: object
      additionalProperties: false
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/BatchOrderResponse'

    PlaceOrderBatchErrorResult:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error class for a rejected entry
          example: "InsufficientFunds"
        message:
          type: string
          description: Human-readable detail for a rejected entry
          example: "Insufficient funds"

    PlaceOrderBatchResult:
      description: Exactly one outcome is present. Accepted entries contain `order`; rejected entries contain `error` and `message`.
      oneOf:
        - $ref: '#/components/schemas/PlaceOrderBatchSuccessResult'
        - $ref: '#/components/schemas/PlaceOrderBatchErrorResult'

    PlaceOrderBatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 20
          description: One result for each submitted order, in request order.
          items:
            $ref: '#/components/schemas/PlaceOrderBatchResult'

    CancelOrderBatchRequest:
      type: object
      required:
        - orderIds
      properties:
        orderIds:
          type: array
          minItems: 1
          maxItems: 20
          description: Order IDs to cancel. Each ID may be an integer or a quoted numeric string. All IDs are validated before any cancellation is attempted.
          items:
            oneOf:
              - type: integer
                format: int64
                example: 12345678
              - type: string
                pattern: '^\d+$'
                example: "12345678"

    CancelOrderBatchSuccessResult:
      type: object
      additionalProperties: false
      required:
        - orderId
        - result
      properties:
        orderId:
          type: integer
          format: int64
          description: Order ID from the corresponding request entry.
          example: 12345678
        result:
          type: string
          enum: [ok]

    CancelOrderBatchErrorResult:
      type: object
      additionalProperties: false
      required:
        - orderId
        - error
        - message
      properties:
        orderId:
          type: integer
          format: int64
          description: Order ID from the corresponding request entry.
          example: 12345678
        error:
          type: string
          description: Error class for a rejected cancellation
          example: "OrderNotFound"
        message:
          type: string
          description: Human-readable detail for a rejected cancellation
          example: "Order 12345678 not found"

    CancelOrderBatchResult:
      description: Exactly one outcome is present. Successful entries contain `orderId` and `result`; rejected entries contain `orderId`, `error`, and `message`.
      oneOf:
        - $ref: '#/components/schemas/CancelOrderBatchSuccessResult'
        - $ref: '#/components/schemas/CancelOrderBatchErrorResult'

    CancelOrderBatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 20
          description: One result for each requested cancellation, in request order.
          items:
            $ref: '#/components/schemas/CancelOrderBatchResult'

    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          example: 12345678
        hashOrderId:
          type: string
          nullable: true
        clientOrderId:
          type: string
          nullable: true
        globalOrderId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        outcome:
          $ref: '#/components/schemas/Outcome'
        orderType:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: string
          description: Original order quantity
        filledQuantity:
          type: string
          description: Amount filled so far
        remainingQuantity:
          type: string
          description: Amount remaining to fill
        price:
          type: string
          description: Limit price
        stopPrice:
          type: string
          nullable: true
          description: Stop trigger price (populated for `stop-limit` orders)
        avgExecutionPrice:
          type: string
          nullable: true
          description: Average price of fills
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        contractMetadata:
          $ref: '#/components/schemas/ContractMetadata'

    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        pagination:
          $ref: '#/components/schemas/PaginationSimple'

