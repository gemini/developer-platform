                        series: null
                        ticker: "BTC100K2028"
                        status: "active"
                        resolvedAt: null
                        createdAt: "2026-01-01T00:00:00.000Z"
                        effectiveDate: "2026-01-01T00:00:00.000Z"
                        expiryDate: "2028-12-31T23:59:59.000Z"
