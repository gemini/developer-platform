  /v1/prediction-markets/maker-rebate/rates:
    get:
      tags:
        - Rewards
      summary: Get maker-rebate rate schedule
      description: |
        Returns the current Maker Rebate rate rules. Public endpoint; no authentication required.

        Each rule defines a `rebate_multiplier_bps` (basis points of the maker fee that is rebated) and an `effective_from` timestamp. An optional `category` scopes the rule to a single market category (omitted rules apply to all categories). An optional `effective_to` marks a rule as superseded.

        Returns `503` with `error: "Maker rebate program is not currently available"` when the program is disabled.
      operationId: getMakerRebateRates
      parameters:
        - name: category
          in: query
          description: Filter to rules that apply to this category (e.g. `Crypto`, `Sports`). When omitted, returns all rules.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakerRebateRatesResponse'
              examples:
                allCategories:
                  summary: Full rate schedule
                  value:
                    rate_rules:
                      - id: 12
                        rebate_multiplier_bps: 5000
                        effective_from: "2026-03-19T00:00:00Z"
                        category: "Crypto"
                      - id: 13
                        rebate_multiplier_bps: 2500
                        effective_from: "2026-03-19T00:00:00Z"
                        category: "Sports"
                        effective_to: "2026-04-19T00:00:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "An unexpected error occurred"
        '503':
          description: Maker rebate program is not currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Maker rebate program is not currently available"

  /v1/prediction-markets/maker-rebate/payouts:
    post:
      tags:
        - Rewards
      summary: List maker-rebate payouts
      description: |
        Returns the authenticated account's Maker Rebate payout history. Most recent payout first.

        Pagination is read from the `limit` and `offset` query parameters: `limit` is clamped to `[1, 100]` (default 50), `offset` is clamped to `[0, +∞)` (default 0).

        Requires authentication with `OrderStatus` permission. Returns `503` when the program is disabled.
      operationId: listMakerRebatePayouts
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of payouts to return (default 50, clamped to [1, 100]).
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of payouts to skip (default 0).
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakerRebatePayoutsResponse'
              examples:
                samplePayouts:
                  summary: Two recent payouts
                  value:
                    payouts:
                      - id: 9182
                        total_volume_usd: "12450.00"
                        total_rebate_usd: "6.23"
                        total_fill_count: 187
                        status: "PAID"
                        paid_at: "2026-05-20T21:00:00Z"
                        created_at: "2026-05-20T20:55:12Z"
                      - id: 9173
                        total_volume_usd: "8920.50"
                        total_rebate_usd: "4.46"
                        total_fill_count: 124
                        status: "PAID"
                        paid_at: "2026-05-19T21:00:00Z"
                        created_at: "2026-05-19T20:55:08Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "An unexpected error occurred"
        '503':
          description: Maker rebate program is not currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Maker rebate program is not currently available"

  /v1/prediction-markets/maker-rebate/summary/total:
    get:
      tags:
        - Rewards
      summary: Get maker-rebate lifetime summary
      description: |
        Returns lifetime totals for the authenticated account's Maker Rebate payouts. When both `dateFrom` and `dateTo` are provided, the totals are restricted to payouts paid within that inclusive Eastern Time window.

        Either provide both date parameters or omit both. Dates must be in `YYYY-MM-DD` format, `dateTo` must be on or after `dateFrom`, and the range must not exceed 5 years.

        Requires authentication with `OrderStatus` permission. Returns `503` when the program is disabled.
      operationId: getMakerRebateLifetimeSummary
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      parameters:
        - name: dateFrom
          in: query
          description: Inclusive start of the payout date window (`YYYY-MM-DD`, Eastern Time). Must be provided together with `dateTo`.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-01"
        - name: dateTo
          in: query
          description: Inclusive end of the payout date window (`YYYY-MM-DD`, Eastern Time). Must be on or after `dateFrom` and within 5 years of it.
          required: false
          schema:
            type: string
            format: date
            example: "2026-05-01"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakerRebateLifetimeSummary'
              examples:
                lifetime:
                  summary: Lifetime totals (no date filter)
                  value:
                    total_earned_usd: "152.40"
                    total_fill_count: 4218
                    total_volume_usd: "304800.00"
                    payout_count: 27
                    first_payout_date: "2026-03-19"
                    last_payout_date: "2026-05-20"
                emptyHistory:
                  summary: Account has never received a payout
                  value:
                    total_earned_usd: "0"
                    total_fill_count: 0
                    total_volume_usd: "0"
                    payout_count: 0
                    first_payout_date: null
                    last_payout_date: null
        '400':
          description: Invalid date parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "BAD_REQUEST"
                message: "date_to must be on or after date_from"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INTERNAL_ERROR"
                message: "An unexpected error occurred"
        '503':
          description: Maker rebate program is not currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "SERVICE_UNAVAILABLE"
                message: "Maker rebate program is not currently available"

  /v1/prediction-markets/liquidity-rewards/config:
    get:
      tags:
        - Rewards
      summary: Get liquidity-rewards program config
      description: |
        Returns the Liquidity Rewards program configuration. Public endpoint; no authentication required.

        When the program is fully configured the response includes `max_spread_cents`, `min_payout_threshold_usd`, and `enabled: true`. When the program is not yet fully configured, the response collapses to `{ "enabled": false }` only.

        Returns `503` when the program is not currently available.
      operationId: getLiquidityRewardsConfig
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityRewardsConfig'
              examples:
                enabled:
                  summary: Program enabled and configured
                  value:
                    max_spread_cents: 10
                    min_payout_threshold_usd: "1.00"
                    enabled: true
                disabledShape:
                  summary: Program flag on but config incomplete upstream
                  value:
                    enabled: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INTERNAL_ERROR"
                message: "An unexpected error occurred"
        '503':
          description: Liquidity rewards program is not currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "SERVICE_UNAVAILABLE"
                message: "Liquidity rewards program is not currently available"

  /v1/prediction-markets/liquidity-rewards/events:
    get:
      tags:
        - Rewards
      summary: List liquidity-rewards events
      description: |
        Returns the paginated list of events currently participating in the Liquidity Rewards program. Public endpoint; no authentication required.

        `category` accepts a comma-separated list of category names (whitespace trimmed, empty entries dropped). `sort` controls ordering. `limit` is clamped to `[1, 100]` (default 50); `offset` is clamped to `[0, +∞)` (default 0). `last_score_date` is the most recent date for which scoring data has been written, or `null` when no scoring has run yet.

        Returns `503` when the program is not currently available.
      operationId: listLiquidityRewardsEvents
      parameters:
        - name: category
          in: query
          description: Comma-separated list of category names. Whitespace is trimmed and empty entries are dropped.
          required: false
          schema:
            type: string
            example: "Crypto,Sports"
        - name: search
          in: query
          description: Filter events by title substring (case-insensitive).
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order for the returned events. Defaults to `daily_pool_desc`.
          required: false
          schema:
            type: string
            default: daily_pool_desc
            enum:
              - daily_pool_desc
              - daily_pool_asc
              - ends_soonest
              - ends_latest
              - title_asc
              - title_desc
              - category_asc
              - category_desc
              - competition_asc
              - competition_desc
        - name: limit
          in: query
          description: Maximum number of events to return (default 50, clamped to [1, 100]).
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of events to skip (default 0).
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityRewardsEventsResponse'
              examples:
                sampleEvents:
                  summary: Two scored events
                  value:
                    events:
                      - event_ticker: "BTC2605202100"
                        title: "BTC above $95,000?"
                        category: "Crypto"
                        daily_pool_usd: "500.00"
                        pool_source: "event_override"
                        ends_at: "2026-05-20T21:00:00Z"
                        qualifying_maker_count: 14
                        icon_url: "https://example.com/btc.png"
                      - event_ticker: "FRENCHOPEN-FINAL"
                        title: "French Open 2026 — Men's Final winner"
                        category: "Sports"
                        daily_pool_usd: "250.00"
                        pool_source: "category_default"
                        ends_at: "2026-06-07T15:00:00Z"
                        qualifying_maker_count: 7
                    pagination:
                      limit: 50
                      offset: 0
                      total: 2
                    last_score_date: "2026-05-19"
                emptyBeforeScoring:
                  summary: Program just turned on, no scoring yet
                  value:
                    events: []
                    pagination:
                      limit: 50
                      offset: 0
                      total: 0
                    last_score_date: null
        '400':
          description: Invalid sort or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "BAD_REQUEST"
                message: "sort must be one of: daily_pool_desc, daily_pool_asc, ends_soonest, ends_latest, title_asc, title_desc, category_asc, category_desc, competition_asc, competition_desc (got 'foo')"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INTERNAL_ERROR"
                message: "An unexpected error occurred"
        '503':
          description: Liquidity rewards program is not currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "SERVICE_UNAVAILABLE"
                message: "Liquidity rewards program is not currently available"

