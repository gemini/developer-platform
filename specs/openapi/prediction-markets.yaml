  /v1/prediction-markets/metrics/volume:
    post:
      tags:
        - Positions
      summary: Get volume metrics
      description: |
        Returns per-contract share volume metrics for an event, including the authenticated user's taker and maker volumes.

        All volumes are in shares (number of contracts traded), not dollar amounts.

        - `totalQty` — Total taker volume across all participants for this contract
        - `userAggressorQty` — The authenticated user's taker (aggressor) volume
        - `userRestingQty` — The authenticated user's maker (resting) volume, counted when another order fills against the user's resting limit order

        An optional time range can be specified to filter trades within a specific window.
      operationId: getVolumeMetrics
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventTicker
              properties:
                eventTicker:
                  type: string
                  description: The event ticker symbol
                  example: "FED260318"
                startTime:
                  type: integer
                  format: int64
                  description: Start of time range filter (epoch milliseconds). If omitted, defaults to the earliest contract creation time.
                endTime:
                  type: integer
                  format: int64
                  description: End of time range filter (epoch milliseconds). If omitted, includes all trades up to now.
            examples:
              allTime:
                summary: All-time volume for an event
                value:
                  eventTicker: "FED260318"
              timeRanged:
                summary: Volume within a specific time range
                value:
                  eventTicker: "FED260318"
                  startTime: 1772412364000
                  endTime: 1772671564000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetricsResponse'
              examples:
                volumeMetrics:
                  summary: Volume metrics for a multi-contract event
                  value:
                    eventTicker: "FED260318"
                    contracts:
                      - symbol: "GEMI-FED260318-CUT25"
                        totalQty: "94625"
                        userAggressorQty: "1"
                        userRestingQty: "0"
                      - symbol: "GEMI-FED260318-CUTGT25"
                        totalQty: "68666"
                        userAggressorQty: "0"
                        userRestingQty: "0"
                      - symbol: "GEMI-FED260318-HIKE"
                        totalQty: "15397"
                        userAggressorQty: "0"
