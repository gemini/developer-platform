  /v1/prediction-markets/order:
    post:
      tags:
        - Trading
      summary: Place order
      description: |
        Place a new prediction market order. Supports limit and stop-limit order types. Requires authentication and NewOrder permission.

        Before sending orders, check `GET /v1/prediction-markets/terms/status`. If `hasAcceptedLatest` is `false`, display `GET /v1/prediction-markets/terms` and call `POST /v1/prediction-markets/terms/accept`, then retry the order.

        Validate each order's quantity and price against the instrument-specific `quantityIncrement`, `quantityMinimum`, `priceIncrement`, and `priceMinimum` returned in the contract metadata. Do not assume a fixed quantity or price grid across instruments.

        ### Stop-Limit Orders
        A stop-limit order is an order type that allows for order placement when a price reaches a specified level. Stop-limit orders take in both a `price` and a `stopPrice` as parameters. The `stopPrice` is the price that triggers the order to be placed on the continuous live order book at the `price`. For buy orders, the `stopPrice` must be greater than or equal to the last trade price and less than or equal to the `price`; for sell orders, the `stopPrice` must be less than or equal to the last trade price and greater than or equal to the `price`. Both `price` and `stopPrice` must be in the 0-1 range.
      operationId: placeOrder
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              buyYes:
                summary: Buy YES contract
                description: Place a limit order to buy 100 YES contracts at 0.65
                value:
                  symbol: "GEMI-FEDJAN26-DN25"
                  orderType: "limit"
                  side: "buy"
                  quantity: "100"
                  price: "0.65"
                  outcome: "yes"
                  timeInForce: "good-til-cancel"
              sellNo:
                summary: Sell NO contract
                description: Place a limit order to sell 50 NO contracts at 0.35
                value:
                  symbol: "GEMI-FEDJAN26-DN25"
                  orderType: "limit"
                  side: "sell"
                  quantity: "50"
                  price: "0.35"
                  outcome: "no"
                  timeInForce: "good-til-cancel"
              makerOnly:
                summary: Maker-only order (post-only)
                description: Place a maker-only order that will be cancelled if it would match immediately. Useful for ensuring you provide liquidity and qualify for maker rebates.
                value:
                  symbol: "GEMI-FEDJAN26-DN25"
                  orderType: "limit"
                  side: "buy"
                  quantity: "100"
                  price: "0.55"
                  outcome: "yes"
                  timeInForce: "good-til-cancel"
                  makerOrCancel: true
              buyYesStopLimit:
                summary: Buy YES stop-limit
                description: Place a stop-limit order to buy 100 YES contracts at 0.70 once the market reaches the stop trigger of 0.65.
                value:
                  symbol: "GEMI-FEDJAN26-DN25"
                  orderType: "stop-limit"
                  side: "buy"
                  quantity: "100"
                  price: "0.70"
                  stopPrice: "0.65"
                  outcome: "yes"
                  timeInForce: "good-til-cancel"
              sellNoStopLimit:
                summary: Sell NO stop-limit
                description: Place a stop-limit order to sell 50 NO contracts at 0.40 once the market falls to the stop trigger of 0.45.
                value:
                  symbol: "GEMI-FEDJAN26-DN25"
                  orderType: "stop-limit"
                  side: "sell"
                  quantity: "50"
                  price: "0.40"
                  stopPrice: "0.45"
                  outcome: "no"
                  timeInForce: "good-til-cancel"
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                orderPlaced:
                  summary: Order successfully placed
                  value:
                    orderId: 12345678901
                    status: "open"
                    symbol: "GEMI-FEDJAN26-DN25"
                    side: "buy"
                    outcome: "yes"
                    orderType: "limit"
                    quantity: "100"
                    filledQuantity: "0"
                    remainingQuantity: "100"
                    price: "0.65"
                    avgExecutionPrice: null
                    createdAt: "2025-12-15T10:30:00.000Z"
                    updatedAt: "2025-12-15T10:30:00.000Z"
                    cancelledAt: null
                    contractMetadata:
                      contractId: "contract_123"
                      contractName: "FEDJAN26-DN25"
                      contractTicker: "FEDJAN26-DN25"
                      eventTicker: "FEDJAN26"
                      eventName: "Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?"
                      category: "economics"
                      contractStatus: "active"
                      imageUrl: "https://example.com/fed.png"
                      expiryDate: "2026-01-31T23:59:59.000Z"
                      resolvedAt: null
                      description: "Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting"
                stopLimitOrderPlaced:
                  summary: Stop-limit order successfully placed
                  value:
                    orderId: 12345678902
                    status: "open"
                    symbol: "GEMI-FEDJAN26-DN25"
                    side: "buy"
                    outcome: "yes"
                    orderType: "stop-limit"
                    quantity: "100"
                    filledQuantity: "0"
                    remainingQuantity: "100"
                    price: "0.70"
                    stopPrice: "0.65"
                    avgExecutionPrice: null
                    createdAt: "2025-12-15T10:30:00.000Z"
                    updatedAt: "2025-12-15T10:30:00.000Z"
                    cancelledAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Order rejected (e.g., insufficient funds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/prediction-markets/order/batch:
    post:
      tags:
        - Trading
      summary: Place a batch of orders
      description: |
        Place between 1 and 20 prediction market orders in one authenticated request. The complete payload is signed once using the standard private REST authentication headers. Each entry accepts the same fields as `POST /v1/prediction-markets/order`.

        The operation is synchronous and non-atomic. Gemini validates the entire batch before submitting any orders. If the batch or any entry fails up-front validation, the request fails and no orders are submitted. After validation succeeds, orders are submitted sequentially and each result is returned in request order. An exchange rejection for one order does not stop later orders from being submitted; it appears as an `error` and `message` for that entry in the `200` response.
      operationId: placeOrderBatch
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderBatchRequest'
            examples:
              twoOrders:
                summary: Place two orders
                value:
                  orders:
                    - symbol: "GEMI-FEDJAN26-DN25"
                      orderType: "limit"
                      side: "buy"
                      quantity: "100"
                      price: "0.65"
                      outcome: "yes"
                      timeInForce: "good-til-cancel"
                    - symbol: "GEMI-FEDJAN26-DN25"
                      orderType: "limit"
                      side: "sell"
                      quantity: "50"
                      price: "0.35"
                      outcome: "no"
                      timeInForce: "good-til-cancel"
      responses:
        '200':
          description: Batch processed. Results are returned in request order and may contain both successful orders and per-entry errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderBatchResponse'
              examples:
                partialSuccess:
                  summary: One order accepted and one order rejected
                  value:
                    results:
                      - order:
                          orderId: 12345678901
                          status: "open"
                          symbol: "GEMI-FEDJAN26-DN25"
                          side: "buy"
                          outcome: "yes"
                          orderType: "limit"
                          timeInForce: "good-til-cancel"
                          quantity: "100"
                          filledQuantity: "0"
                          remainingQuantity: "100"
                          price: "0.65"
                          createdAt: "2025-12-15T10:30:00.000Z"
                          updatedAt: "2025-12-15T10:30:00.000Z"
                      - error: "InsufficientFunds"
                        message: "Insufficient funds"
        '400':
          description: Invalid payload, empty batch, more than 20 entries, or an invalid order. No orders are submitted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthErrorResponse'
                  - $ref: '#/components/schemas/PredictionMarketsError'
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: The account is not permitted to place orders or has not accepted the current Prediction Markets terms. No orders are submitted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthErrorResponse'
                  - $ref: '#/components/schemas/AccountGroupBlockedError'
                  - $ref: '#/components/schemas/TermsNotAcceptedError'
                  - $ref: '#/components/schemas/RestrictedSellOnlyError'
        '409':
          description: The request nonce conflicts with a previously submitted request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: An order failed an up-front risk check. No orders are submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMarketsError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMarketsError'
        '503':
          description: Prediction markets or batch orders are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMarketsError'

  /v1/prediction-markets/order/cancel:
    post:
      tags:
        - Trading
      summary: Cancel order
      description: Cancel an existing prediction market order. Requires authentication and CancelOrder permission.
      operationId: cancelOrder
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: integer
                  format: int64
                  description: The order ID to cancel
                  example: 12345678
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "Order 12345678 cancelled successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Order cannot be cancelled (e.g., already filled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/prediction-markets/order/batch/cancel:
    post:
      tags:
        - Trading
      summary: Cancel a batch of orders
      description: |
        Cancel between 1 and 20 prediction market orders in one authenticated request. The complete payload is signed once using the standard private REST authentication headers. Each order ID may be a JSON integer or a quoted numeric string.

        The operation is synchronous and non-atomic. Gemini validates all order IDs before attempting any cancellation. If the batch is empty, contains more than 20 entries, or contains an invalid ID, the request fails and no orders are cancelled. After validation succeeds, cancellations are attempted sequentially and each result is returned in request order. A rejection for one cancellation does not stop later cancellations from being attempted; it appears as an `error` and `message` for that entry in the `200` response.
      operationId: cancelOrderBatch
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderBatchRequest'
            examples:
              twoOrders:
                summary: Cancel two orders
                value:
                  orderIds:
                    - 12345678
                    - "12345679"
      responses:
        '200':
          description: Batch processed. Results are returned in request order and may contain both successful cancellations and per-entry errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderBatchResponse'
              examples:
                partialSuccess:
                  summary: One order cancelled and one order not found
                  value:
                    results:
                      - orderId: 12345678
                        result: "ok"
                      - orderId: 12345679
                        error: "OrderNotFound"
                        message: "Order 12345679 not found"
        '400':
          description: Invalid payload, empty batch, more than 20 entries, or an invalid order ID. No orders are cancelled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthErrorResponse'
                  - $ref: '#/components/schemas/PredictionMarketsError'
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: The account is not permitted to cancel orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: The request nonce conflicts with a previously submitted request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMarketsError'
        '503':
          description: Prediction markets or batch orders are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMarketsError'

