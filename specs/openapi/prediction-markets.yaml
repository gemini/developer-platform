    post:
      tags:
        - Combos
      summary: Create or retrieve a canonical combo
      description: |
        Creates a combo from two to six underlying contract legs for the authenticated account. The service canonicalizes the complete leg set, so submitting the same legs again returns the existing combo regardless of leg order. The account is derived from the authenticated API key; do not include an account ID in the request. This Combo Prediction Markets endpoint is not currently enabled in production.

        Requires signed private REST authentication, the `PredictionsNewOrder` permission, and an unrestricted trading account. A new canonical combo returns `201 Created` with `alreadyExisted: false`; an existing canonical combo returns `200 OK` with `alreadyExisted: true`.
      operationId: createCombo
      security:
        - apiKey: []
          payloadAuth: []
          signatureAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComboRequest'
            examples:
              twoLegCombo:
                summary: Create a two-leg combo
                value:
                  legs:
                    - contractId: "101"
                      requiredOutcome: "Yes"
                    - contractId: "202"
                      requiredOutcome: "No"
      responses:
        '200':
          description: The canonical combo already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateComboResponse'
              examples:
                existingCombo:
                  summary: Existing canonical combo
                  value:
                    combo:
                      id: 456
                      canonicalLegKey: "101:Yes|202:No"
                      legCount: 2
                      displayName: "BTC EOY26 > $120k AND ETH EOY26 <= $4k"
                      status: "Active"
                      instrumentId: 98765
                      instrumentSymbol: "GEMI-CMB-0526-A7F3B2C1D4E5"
                      instrumentRegistered: true
                      latestExpiryDate: "2026-12-31T23:59:59.000Z"
                      createdAt: "2026-05-01T12:00:00.000Z"
                      updatedAt: "2026-05-01T12:00:00.000Z"
                      legs:
                        - comboId: 456
                          legIndex: 0
                          contractId: "101"
                          requiredOutcome: "Yes"
                        - comboId: 456
                          legIndex: 1
                          contractId: "202"
                          requiredOutcome: "No"
                    alreadyExisted: true
        '201':
          description: A new canonical combo was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateComboResponse'
              examples:
                createdCombo:
                  summary: New canonical combo
                  value:
                    combo:
                      id: 456
                      canonicalLegKey: "101:Yes|202:No"
                      legCount: 2
                      displayName: "BTC EOY26 > $120k AND ETH EOY26 <= $4k"
                      status: "Active"
                      instrumentId: 98765
                      instrumentSymbol: "GEMI-CMB-0526-A7F3B2C1D4E5"
                      instrumentRegistered: true
                      latestExpiryDate: "2026-12-31T23:59:59.000Z"
                      createdAt: "2026-05-01T12:00:00.000Z"
                      updatedAt: "2026-05-01T12:00:00.000Z"
                      legs:
                        - comboId: 456
                          legIndex: 0
                          contractId: "101"
                          requiredOutcome: "Yes"
                        - comboId: 456
                          legIndex: 1
                          contractId: "202"
                          requiredOutcome: "No"
                    alreadyExisted: false
        '400':
          description: The request body is malformed or fails combo validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboWriteError'
              example:
                error: "InvalidInput"
                code: "COMBO_VALIDATION_ERROR"
                message: "a combo needs 2-6 legs"
        '401':
          description: Signed private REST authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: The API key lacks `PredictionsNewOrder`, or the authenticated trading account is restricted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Combos are unavailable, or an underlying contract in the request cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboWriteError'
              examples:
                comboUnavailable:
                  summary: Combos unavailable
                  value:
                    error: "NOT_FOUND"
                    message: "Not Found"
                legNotFound:
                  summary: Underlying contract not found
                  value:
                    error: "NOT_FOUND"
                    code: "COMBO_LEG_NOT_FOUND"
                    message: "One or more contracts in this combo could not be found. Update your selection and try again."
        '500':
          description: An unexpected error occurred while creating the combo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboWriteError'
              example:
                error: "InternalError"
                message: "An unexpected error occurred"

